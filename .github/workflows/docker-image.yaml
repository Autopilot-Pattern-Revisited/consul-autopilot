name: Docker image

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      consul_version:
        description: Consul version to copy from the official HashiCorp image
        required: true
        default: "1.22.7"
      alpine_version:
        description: Alpine base image version
        required: true
        default: "3.23.4"

permissions:
  contents: read
  packages: write

env:
  DEFAULT_CONSUL_VERSION: "1.22.7"
  DEFAULT_ALPINE_VERSION: "3.23.4"

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image settings
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "package=${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.image.outputs.publish == 'true' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.image.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CONSUL_VERSION=${{ inputs.consul_version || env.DEFAULT_CONSUL_VERSION }}
            ALPINE_VERSION=${{ inputs.alpine_version || env.DEFAULT_ALPINE_VERSION }}

      - name: Make GHCR package public
        if: steps.image.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ steps.image.outputs.package }}
        shell: bash
        run: |
          if gh api "/orgs/${GITHUB_REPOSITORY_OWNER}" >/dev/null 2>&1; then
            gh api --method PATCH "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}/visibility" -f visibility=public || true
          else
            gh api --method PATCH "/user/packages/container/${PACKAGE}/visibility" -f visibility=public || true
          fi
